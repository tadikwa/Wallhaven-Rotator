name: Publish unsigned release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Public release version'
        required: true
        default: '1.1.0'

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate version
        shell: pwsh
        run: |
          $expected = (Get-Content VERSION -Raw).Trim()
          if ("${{ inputs.version }}" -ne $expected) {
            throw "Workflow version '${{ inputs.version }}' != VERSION '$expected'"
          }

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23.2'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'

      - name: Build unsigned setup
        shell: pwsh
        run: ./scripts/Build.ps1 -Version "${{ inputs.version }}"

      - name: Prepare unsigned public asset
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          Copy-Item "dist/WallhavenRotator-Setup-v$v.exe" "dist/WallhavenRotator-Setup-v$v-unsigned.exe"
          $hash = Get-FileHash "dist/WallhavenRotator-Setup-v$v-unsigned.exe" -Algorithm SHA256
          "{0}  WallhavenRotator-Setup-v{1}-unsigned.exe" -f $hash.Hash.ToLowerInvariant(), $v |
            Set-Content "dist/SHA256SUMS.txt" -Encoding ASCII

      - name: Create release notes from resolved issues
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $v = "${{ inputs.version }}"
          $repo = "${{ github.repository }}"
          $sha = "${{ github.sha }}"

          # A normal Wallhaven Rotator release is triggered after its release PR
          # has been merged to main. Ask GitHub which PR(s) contain this commit.
          $prs = @(
            gh api `
              -H "Accept: application/vnd.github+json" `
              -H "X-GitHub-Api-Version: 2022-11-28" `
              "/repos/$repo/commits/$sha/pulls" |
              ConvertFrom-Json
          )

          $issueNumbers = New-Object 'System.Collections.Generic.HashSet[int]'

          foreach ($pr in $prs) {
            $body = [string]$pr.body

            if ([string]::IsNullOrWhiteSpace($body)) {
              continue
            }

            $matches = [regex]::Matches(
              $body,
              '(?im)^\s*(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(?<n>\d+)\s*$'
            )

            foreach ($match in $matches) {
              [void]$issueNumbers.Add([int]$match.Groups['n'].Value)
            }
          }

          $changelog = New-Object 'System.Collections.Generic.List[string]'

          foreach ($number in @($issueNumbers | Sort-Object)) {
            $issue = gh api `
              -H "Accept: application/vnd.github+json" `
              -H "X-GitHub-Api-Version: 2022-11-28" `
              "/repos/$repo/issues/$number" |
              ConvertFrom-Json

            if ($issue.pull_request) {
              continue
            }

            $title = ([string]$issue.title).Trim()
            $url = [string]$issue.html_url
            $changelog.Add("- [#$number]($url) - $title")
          }

          if ($changelog.Count -eq 0) {
            $changelog.Add("- No linked issues were declared by the merged release pull request.")
          }

          $changelogText = $changelog -join "`r`n"

          $notes = @"
          # Wallhaven Rotator $v

          Wallhaven Rotator $v built from the public source repository.

          ## Changelog

          $changelogText

          ## Download and signing

          The unsigned installer is built by GitHub Actions from the public source repository.

          After SignPath Foundation approval, the signed installer will be added to this same release as ``WallhavenRotator-Setup-v$v.exe``; the original unsigned asset remains available for provenance.

          ## Code signing policy

          See [CODE_SIGNING.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/CODE_SIGNING.md).

          Free code signing provided by SignPath.io, certificate by SignPath Foundation.

          ## Privacy

          See [PRIVACY.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/PRIVACY.md).
          "@

          $notes | Set-Content release-notes.md -Encoding UTF8

      - name: Create public GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ inputs.version }}"
          $tag = "v$v"

          gh release create $tag `
            "dist/WallhavenRotator-Setup-v$v-unsigned.exe#Unsigned installer" `
            "dist/SHA256SUMS.txt#SHA-256 checksums" `
            --target "${{ github.sha }}" `
            --title "Wallhaven Rotator $v" `
            --notes-file release-notes.md
