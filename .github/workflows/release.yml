name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Public release version'
        required: true
        default: '1.2.0'

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate version
        shell: pwsh
        run: |
          $expected = (Get-Content VERSION -Raw).Trim()
          if ("${{ inputs.version }}" -ne $expected) {
            throw "Workflow version '${{ inputs.version }}' != VERSION '$expected'"
          }

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23.2'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'

      - name: Build setup
        shell: pwsh
        run: ./scripts/Build.ps1 -Version "${{ inputs.version }}"

      - name: Prepare SHA-256 manifest
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          $setup = "dist/WallhavenRotator-Setup-v$v.exe"
          $hash = Get-FileHash $setup -Algorithm SHA256
          "{0}  WallhavenRotator-Setup-v{1}.exe" -f $hash.Hash.ToLowerInvariant(), $v |
            Set-Content "dist/SHA256SUMS.txt" -Encoding ASCII

      - name: Create release notes from resolved issues
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $v = "${{ inputs.version }}"
          $repo = "${{ github.repository }}"
          $sha = "${{ github.sha }}"

          $prs = @(
            gh api `
              -H "Accept: application/vnd.github+json" `
              -H "X-GitHub-Api-Version: 2022-11-28" `
              "/repos/$repo/commits/$sha/pulls" |
              ConvertFrom-Json
          )

          $issueNumbers = New-Object 'System.Collections.Generic.HashSet[int]'

          foreach ($pr in $prs) {
            $body = [string]$pr.body
            if ([string]::IsNullOrWhiteSpace($body)) {
              continue
            }

            $matches = [regex]::Matches(
              $body,
              '(?im)^\s*(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(?<n>\d+)\s*$'
            )

            foreach ($match in $matches) {
              [void]$issueNumbers.Add([int]$match.Groups['n'].Value)
            }
          }

          $changelog = New-Object 'System.Collections.Generic.List[string]'

          foreach ($number in @($issueNumbers | Sort-Object)) {
            $issue = gh api `
              -H "Accept: application/vnd.github+json" `
              -H "X-GitHub-Api-Version: 2022-11-28" `
              "/repos/$repo/issues/$number" |
              ConvertFrom-Json

            if ($issue.pull_request) {
              continue
            }

            $title = ([string]$issue.title).Trim()
            $url = [string]$issue.html_url
            $changelog.Add("- [#$number]($url) - $title")
          }

          if ($changelog.Count -eq 0) {
            $changelog.Add("- No linked issues were declared by the merged release pull request.")
          }

          $changelogText = $changelog -join "`r`n"

          $notes = @"
          # Wallhaven Rotator $v

          Wallhaven Rotator $v built from the public source repository.

          ## Changelog

          $changelogText

          ## Download integrity

          The official Windows installer is built by GitHub Actions from this public repository.

          Verify the downloaded installer against `SHA256SUMS.txt` if you want an independent integrity check.

          ## Privacy

          See [PRIVACY.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/PRIVACY.md).
          "@

          $notes | Set-Content release-notes.md -Encoding UTF8

      - name: Create public GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ inputs.version }}"
          $tag = "v$v"

          gh release create $tag `
            "dist/WallhavenRotator-Setup-v$v.exe#Windows x64 installer" `
            "dist/SHA256SUMS.txt#SHA-256 checksums" `
            --target "${{ github.sha }}" `
            --title "Wallhaven Rotator $v" `
            --notes-file release-notes.md
