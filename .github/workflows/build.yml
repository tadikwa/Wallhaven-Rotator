name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23.2'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'

      - name: Regression test - fresh history initialization (Windows PowerShell 5.1)
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tests\HistoryInitialization.Tests.ps1

      - name: Display ratio mapping tests (Windows PowerShell 5.1)
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tests\DisplayFilter.Tests.ps1

      - name: Update helper tests (Windows PowerShell 5.1)
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tests\UpdateHelpers.Tests.ps1

      - name: Setup Go tests
        shell: pwsh
        working-directory: setup
        run: go test ./...

      - name: Build unsigned setup
        shell: pwsh
        run: ./scripts/Build.ps1

      - name: Upload unsigned build
        uses: actions/upload-artifact@v7
        with:
          name: WallhavenRotator-Setup-unsigned
          path: |
            dist/WallhavenRotator-Setup-v*.exe
            dist/WallhavenRotator-Setup-v*-SHA256.txt
          if-no-files-found: error
